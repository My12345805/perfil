<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Formulário de Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* Mantendo o padrão visual da sua identidade do site */
        .bg-custom-header { background-color: #f9f9f9; }
        .text-custom-navy { color: #0a2540; }
        .btn-outline-purple { border: 1px solid #8a2be2; color: #8a2be2; background: transparent; transition: all 0.3s; }
        .btn-outline-purple:hover { background-color: #8a2be2; color: rgb(255, 255, 255); }
        .footer-gradient-box {
            border: 2px solid transparent;
            border-image: linear-gradient(to right, #8a2be2, #00ffff) 1;
            background-color: #0d1117;
            color: rgb(251, 243, 243);
            padding: 10px 20px;
        }   
    </style>
</head>
<body class="bg-white d-flex flex-column min-vh-100">

    <header class="bg-custom-header py-3 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <nav class="nav gap-3">
                <a class="nav-link p-0 fw-bold text-dark fs-5" href="index.html">Home</a>
                <a class="nav-link p-0 fw-bold text-dark fs-5" href="portfolio.html">Portfólio</a>
                <a class="nav-link p-0 fw-bold text-dark fs-5 active" href="contato.html">Contato</a>
            </nav>
        </div>
    </header>

    <main class="container my-4 flex-grow-1">
        
        <div class="mb-4 text-start">
            <a href="index.html" class="btn btn-outline-purple text-uppercase px-4 py-2 small fw-semibold">Voltar</a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">
                <div class="card shadow-sm p-4 md-p-5 border rounded bg-white">
                    
                    <h2 class="text-center fw-bold text-custom-navy mb-4 fs-3">Formulário de Feedback</h2>
                    
                    <form action="mailto:myhcristine08@gmail.com" method="GET" enctype="text/plain">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-6">
                                <input type="text" name="firstName" class="form-control py-2" placeholder="Primeiro Nome:" required>
                            </div>
                            <div class="col-12 col-sm-6">
                                <input type="text" name="lastName" class="form-control py-2" placeholder="Último Nome:" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="email" name="email" class="form-control py-2" placeholder="Email:" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-custom-navy small">Diga pontos deste perfil interessantes:</label>
                            <textarea name="pontos_interessantes" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-custom-navy small d-block">Cor favorita?</label>
                            <input type="color" name="cor_favorita" class="form-control form-control-color" id="corFavorita" value="#0a2540" title="Escolha sua cor">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-custom-navy small">Qual habilidade mais te interessa?</label>
                            <select name="habilidade_interesse" class="form-select">
                                <option selected>Escolha...</option>
                                <option value="html">HTML / CSS</option>
                                <option value="bootstrap">Bootstrap 5</option>
                                <option value="javascript">JavaScript</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-custom-navy small d-block">Qual seu gosto musical?</label>
                            
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" name="gosto_musical" value="Rock" id="gostoRock">
                                <label class="form-check-label text-dark fw-semibold small" Jacks for="gostoRock">Rock</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" name="gosto_musical" value="Pop" id="gostoPop" checked>
                                <label class="form-check-label text-dark fw-semibold small" for="gostoPop">Pop</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" name="gosto_musical" value="Classica" id="gostoClassica">
                                <label class="form-check-label text-dark fw-semibold small" for="gostoClassica">Clássica</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" name="gosto_musical" value="Eletronica" id="gostoEletronica">
                                <label class="form-check-label text-dark fw-semibold small" for="gostoEletronica">Eletrônica</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="gosto_musical" value="Outra" id="gostoOutra">
                                <label class="form-check-label text-dark fw-semibold small" for="gostoOutra">Outra</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-custom-navy small d-block">Qual nota daria para este perfil?</label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota1" value="1">
                                    <label class="form-check-label small fw-semibold" for="nota1">1</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota2" value="2">
                                    <label class="form-check-label small fw-semibold" for="nota2">2</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota3" value="3">
                                    <label class="form-check-label small fw-semibold" for="nota3">3</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota4" value="4">
                                    <label class="form-check-label small fw-semibold" for="nota4">4</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota5" value="5">
                                    <label class="form-check-label small fw-semibold" for="nota5">5</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota6" value="6">
                                    <label class="form-check-label small fw-semibold" for="nota6">6</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota7" value="7">
                                    <label class="form-check-label small fw-semibold" for="nota7">7</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota8" value="8">
                                    <label class="form-check-label small fw-semibold" for="nota8">8</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota9" value="9">
                                    <label class="form-check-label small fw-semibold" for="nota9">9</label>
                                </div>
                                <div class="form-check form-check-inline m-0">
                                    <input class="form-check-input" type="radio" name="nota_perfil" id="nota10" value="10">
                                    <label class="form-check-label small fw-semibold" for="nota10">10</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-custom-navy small">Adicione um comentário:</label>
                            <textarea name="comentario" class="form-control" rows="3"></textarea>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Enviar Feedback</button>
                    </form>

                </div>
            </div>
        </div>
    </main>

     <footer class="custom-footer text-white pt-5 pb-4 mt-auto">
        <div class="container text-center d-flex flex-column align-items-center justify-content-center">

            <a class="footer-gradient-box mb-3 fw-semibold text-decoration-none"
                data-bs-toggle="collapse" href="#conteudoEmail" role="button" aria-expanded="false"
                aria-controls="conteudoEmail">
                <i class="#"></i>Informações para Contato   
            </a>

            <div class="collapse" id="conteudoEmail">
                <div class="mt-2 mb-3">
                    <a href="mailto:myhcristine08@gmail.com" class="text-white-50 text-decoration-none fs-5 hover-up d-inline-block">
                        <i class="bi bi-envelope-fill text-purple me-2"></i>myhcristine08@gmail.com
                    </a>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-4 fs-3 mt-3">
                <a href="https://www.instagram.com/_hemy.silva_/" class="social-icon"><i class="bi bi-instagram"></i></a>
                <a href="https://www.linkedin.com/feed/" class="social-icon"><i class="bi bi-linkedin"></i></a>
                <a href="https://github.com/My12345805" class="social-icon"><i class="bi bi-github"></i></a>
            </div>
            
            <p class="text-muted small mt-4 mb-0">&copy; 2026 Hemilly Duarte. Desenvolvido com Bootstrap 5.</p>
        </div>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
